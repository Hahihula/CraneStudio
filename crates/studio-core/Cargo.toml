[package]
name = "studio-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "studio_core"
path = "src/lib.rs"

[dependencies]
sysinfo = "0.38.4"
nvml-wrapper = { version = "0.12", optional = true }
cudarc = { version = "0.19", default-features = false, features = ["driver", "dynamic-linking", "cuda-version-from-build-system"], optional = true }
directories = "6.0.0"
ron = "0.12.2"
serde = { workspace = true, features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json", "query", "stream"] }
serde_json.workspace = true
sha2 = "0.11.0"
tokio-util = "0.7.19"
futures-util = "0.3.34"
tokio = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.29", optional = true }

[features]
cuda = ["dep:nvml-wrapper", "dep:cudarc"]
metal = ["dep:metal"]

[dev-dependencies]
crane-serve.workspace = true
tempfile = "3.27.0"
