[package]
name = "cranestudio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cranestudio"
path = "src/main.rs"

[dependencies]
studio-core = { workspace = true }
studio-supervisor.workspace = true
studio-gateway.workspace = true
studio-tui = { workspace = true }
crane-serve = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", features = ["json"] }
serde_json.workspace = true
axum = "0.8.9"

[features]
default = []
cuda = ["crane-serve/cuda", "studio-core/cuda"]
metal = ["crane-serve/metal", "studio-core/metal"]
accelerate = ["crane-serve/accelerate"]
rocm = ["crane-serve/rocm"]
cudnn = ["crane-serve/cudnn"]
mkl = ["crane-serve/mkl"]
# Intel oneAPI/SYCL backend (proof-of-concept upstream, PR #134). Needed for
# Battlemage (Arc B-series) GPUs. Like `rocm`, build with
# `--no-default-features --features sycl` — see crane-core's Cargo.toml
# `default-backend` comment. No hardware detection on the CraneStudio side
# yet (§2.5, §13 in PLAN.md); studio-core has no Intel GPU prober.
sycl = ["crane-serve/sycl"]
