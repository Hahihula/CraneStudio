[workspace]
resolver = "2"
members = [
    "crates/studio-core",
    "crates/studio-supervisor",
    "crates/studio-gateway",
    "crates/studio-tui",
    "crates/cranestudio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hahihula/CraneStudio"

[workspace.dependencies]
crane-serve = { git = "https://github.com/lucasjinreal/Crane", rev = "3a59e3253c9c0c0d6a8f29f9d4cc1760683ce51d" }


anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
rand = "0.9"

studio-core = { path = "crates/studio-core" }
studio-supervisor = { path = "crates/studio-supervisor" }
studio-gateway = { path = "crates/studio-gateway" }
studio-tui = { path = "crates/studio-tui" }
