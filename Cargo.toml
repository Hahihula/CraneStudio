[workspace]
resolver = "2"
members = [
    "crates/studio-core",
    "crates/studio-supervisor",
    "crates/studio-gateway",
    "crates/studio-tui",
    "crates/cranestudio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hahihula/CraneStudio"

[workspace.dependencies]
# lucasjinreal/Crane main @ 2026-08-17. Includes:
#   PR  #99 — Qwen 3.5 GGUF long-prompt quant fix
#   PR #100 — Qwen 3.6 / 3.8 (27B) support
#   PR #102 — OpenAI tool calling in crane-serve
# crane-serve = { git = "https://github.com/lucasjinreal/Crane", rev = "a3d338695f1105742a995ec2a2313b20e28f2844" }
crane-serve = { git = "https://github.com/Hahihula/Crane", rev = "41b70560e6f71962876b508b0d6bd92b1beb8365" }


anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"

studio-core = { path = "crates/studio-core" }
studio-supervisor = { path = "crates/studio-supervisor" }
studio-gateway = { path = "crates/studio-gateway" }
studio-tui = { path = "crates/studio-tui" }