[workspace]
resolver = "2"
members = [
    "crates/studio-core",
    "crates/studio-supervisor",
    "crates/studio-gateway",
    "crates/studio-tui",
    "crates/cranestudio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hahihula/CraneStudio"

[workspace.dependencies]
crane-serve = { git = "https://github.com/Hahihula/Crane", rev = "71e1d9f2fa5394e89fb8960bce87a44f02ddb84b" }


anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
rand = "0.9"

studio-core = { path = "crates/studio-core" }
studio-supervisor = { path = "crates/studio-supervisor" }
studio-gateway = { path = "crates/studio-gateway" }
studio-tui = { path = "crates/studio-tui" }
